<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Journal — TradeDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">

</head>
<body>

<!-- APP SHELL -->
<div id="sc-app" style="display:flex">

  <!-- TOPBAR -->
  <div class="at">
    <a class="at-logo" href="../index.html">
      <div class="at-logo-mark">TD</div>
      <span class="at-logo-text">Trade<em>Desk</em></span>
    </a>
    <div class="at-stats">
      <div class="ats"><span class="ats-l">Month P&L</span><span class="ats-v" id="tb-pnl">$0.00</span></div>
      <div class="ats"><span class="ats-l">Payouts</span><span class="ats-v" id="tb-pay">$0.00</span></div>
      <div class="ats"><span class="ats-l">Net</span><span class="ats-v" id="tb-net">$0.00</span></div>
    </div>
    <div class="at-right">
      <div class="sync" id="sdot"></div>
      <div class="at-user">
        <div class="at-avatar" id="uinit-wrap"><img id="uavatar" src="" alt=""><span id="uinit">TD</span></div>
        <span class="uname" id="uname">—</span>
      </div>
      <button class="at-btn" id="theme-btn" onclick="toggleTheme()">☀</button>
      <button class="at-btn" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>

  <!-- BODY -->
  <div class="ab">

    <!-- SIDEBAR -->
    <nav class="sb">
      <div class="sb-label">Trading</div>
      <button class="sb-item" onclick="window.location.href='cal.html'"><span class="sb-item-ico">📅</span>Calendar</button>
        <button class="sb-item" onclick="window.location.href='charts.html'"><span class="sb-item-ico">📊</span>Analytics</button>
        <button class="sb-item on" onclick="window.location.href='journal.html'"><span class="sb-item-ico">📓</span>Journal</button>
        <button class="sb-item" onclick="window.location.href='planner.html'"><span class="sb-item-ico">🎯</span>Planner</button>
      <div class="sb-rule"></div>
      <div class="sb-label">Management</div>
      <button class="sb-item" onclick="window.location.href='firms.html'"><span class="sb-item-ico">🏢</span>Prop Firms</button>
        <button class="sb-item" onclick="window.location.href='summary.html'"><span class="sb-item-ico">📆</span>Summary</button>
        <button class="sb-item" onclick="window.location.href='finance.html'"><span class="sb-item-ico">💵</span>Finance</button>
        <button class="sb-item" onclick="window.location.href='pro.html'"><span class="sb-item-ico">⚡</span>Pro</button>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="mc">
      <div class="pg on" id="pg-journal">
<div>
        <div class="ph">
          <div class="ph-left">
            <div class="ph-eyebrow">Trade Journal</div>
            <div class="ph-title">Daily <em>Logs</em></div>
          </div>
          <button class="btn btn-amber btn-sm" onclick="goTab('cal')">+ Log Trade</button>
        </div>
        <div class="j-bar">
          <div class="j-search-wrap">
            <span class="j-search-ico">🔍</span>
            <input id="j-search" type="text" placeholder="Search symbol, notes, tags..." oninput="renderJournal()">
          </div>
          <div class="j-filt-wrap">
            <button class="j-filt on" id="jf-all" onclick="setJF('all',this)">All</button>
            <button class="j-filt" id="jf-win" onclick="setJF('win',this)">Wins</button>
            <button class="j-filt" id="jf-loss" onclick="setJF('loss',this)">Losses</button>
          </div>
        </div>
        <div class="j-list" id="journal-list"></div>
      </div>
      </div>
    </main>

  </div><!-- /ab -->
</div><!-- /sc-app -->

<!-- MODALS (shared) -->
<div class="ov" id="tm-ov" onclick="if(event.target===this)closeTM()">
  <div class="modal" id="tm-modal">
    <div class="modal-hd"><span class="modal-title" id="tm-title">Log Trade Day</span><button class="modal-x" onclick="closeTM()">✕</button></div>
    <div class="ln modal-body" style="padding:20px;display:flex;flex-direction:column;gap:14px;">
      <div class="modal-grid">
        <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="tm-date"></div>
        <div class="form-group"><label class="form-label">Total P&L ($)</label><input class="form-input" type="number" id="tm-pnl" placeholder="e.g. 420.00" step="0.01"></div>
      </div>
      <div class="form-group"><label class="form-label">Emotion / Mindset</label>
        <div class="emo-row" id="emo-row">
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">😤 Frustrated</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">😰 Anxious</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">😎 Confident</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">😌 Calm</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">🤑 FOMO</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">🧘 Patient</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">😤 Revenge</button>
          <button class="emo-btn" onclick="document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('on'));this.classList.add('on')">🎯 Focused</button>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="tm-notes" rows="3" placeholder="What happened today? Setups, mistakes, lessons..."></textarea></div>
      <div id="tm-trades-wrap"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="clearDay()">Clear Day</button>
        <button class="btn btn-amber" onclick="saveDay()">Save Day</button>
      </div>
    </div>
  </div>
</div>

<!-- FIRM MODAL -->
<div class="ov" id="fm-ov" onclick="if(event.target===this)closeFM()">
  <div class="modal" id="fm-modal">
    <div class="modal-hd"><span class="modal-title" id="fm-title">Add Firm</span><button class="modal-x" onclick="closeFM()">✕</button></div>
    <div class="modal-body" style="padding:20px;display:flex;flex-direction:column;gap:14px;">
      <div class="modal-grid">
        <div class="form-group"><label class="form-label">Firm Name</label><input class="form-input" id="fm-name" placeholder="e.g. FTMO"></div>
        <div class="form-group"><label class="form-label">Account Size ($)</label><input class="form-input" type="number" id="fm-size" placeholder="100000"></div>
      </div>
      <div class="modal-grid">
        <div class="form-group"><label class="form-label">Phase</label>
          <select class="form-input" id="fm-phase">
            <option value="challenge">Challenge</option>
            <option value="verification">Verification</option>
            <option value="funded">Funded</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Current Balance ($)</label><input class="form-input" type="number" id="fm-bal" placeholder="100000"></div>
      </div>
      <div class="modal-grid">
        <div class="form-group"><label class="form-label">Profit Target ($)</label><input class="form-input" type="number" id="fm-target" placeholder="10000"></div>
        <div class="form-group"><label class="form-label">Max Daily Loss ($)</label><input class="form-input" type="number" id="fm-daily" placeholder="2000"></div>
      </div>
      <div class="modal-grid">
        <div class="form-group"><label class="form-label">Max Drawdown ($)</label><input class="form-input" type="number" id="fm-dd" placeholder="10000"></div>
        <div class="form-group"><label class="form-label">Start Date</label><input class="form-input" type="date" id="fm-start"></div>
      </div>
      <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="fm-notes" rows="2"></textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost btn-sm" onclick="closeFM()">Cancel</button>
        <button class="btn btn-amber" onclick="saveFirm()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
    <button class="bn" onclick="window.location.href='cal.html'"><div class="bn-ico">📅</div>Cal</button>
    <button class="bn" onclick="window.location.href='charts.html'"><div class="bn-ico">📊</div>Data</button>
    <button class="bn on" onclick="window.location.href='journal.html'"><div class="bn-ico">📓</div>Log</button>
    <button class="bn" onclick="window.location.href='planner.html'"><div class="bn-ico">🎯</div>Plan</button>
    <button class="bn" onclick="window.location.href='firms.html'"><div class="bn-ico">🏢</div>Firms</button>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const FC={apiKey:"AIzaSyCACYBsV7UocUCsL1DgtNd_iTdes2_VHZU",authDomain:"trade-desk---trading-tracker.firebaseapp.com",projectId:"trade-desk---trading-tracker",storageBucket:"trade-desk---trading-tracker.firebasestorage.app",messagingSenderId:"126552279055",appId:"1:126552279055:web:1d3b15c892a6d1d6957b7a"};
const FA=initializeApp(FC);
const auth=getAuth(FA),db=getFirestore(FA),gp=new GoogleAuthProvider();
window._auth=auth;window._db=db;
window._fb={signOut,onAuthStateChanged,doc,setDoc,getDoc,gp};
onAuthStateChanged(auth,async u=>{
  if(!u){window.location.href='../login.html';return;}
  window._user=u;
  try{const sn=await getDoc(doc(db,'users',u.uid));if(sn.exists()&&sn.data().tradeData)localStorage.setItem('tdp1',JSON.stringify(sn.data().tradeData));}catch(e){}
  pageBoot();
});

// load shared app logic
const s = document.createElement('script');
s.src = '../shared/app.js';
s.onload = () => {
  const t=localStorage.getItem('tdp_theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  const btn=document.getElementById('theme-btn');
  if(btn) btn.textContent=t==='dark'?'☀':'🌙';
  window.pageBoot = function(){
    if(typeof updateTop==='function') updateTop();
    window.pageBoot = function(){
    updateTop&&updateTop();
    renderJournal();
  };
  if(window._user) window.pageBoot();
};
  // if already loaded
  if(window._user) window.pageBoot();
};
document.head.appendChild(s);
</script>

</body>
</html>
