<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeDesk — Day Trading Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #1a1f26;
    --border: #1e2530;
    --accent: #00e5a0;
    --accent2: #ff4d6d;
    --accent3: #ffd60a;
    --text: #e8edf5;
    --muted: #5a6478;
    --profit: #00e5a0;
    --loss: #ff4d6d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* HEADER */
  header {
    padding: 24px 0 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -1px;
  }
  .logo span { color: var(--muted); }

  .header-stats {
    display: flex;
    gap: 32px;
  }

  .hstat {
    text-align: right;
  }
  .hstat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
  .hstat-value { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; }
  .hstat-value.green { color: var(--profit); }
  .hstat-value.red { color: var(--loss); }
  .hstat-value.yellow { color: var(--accent3); }

  /* MAIN LAYOUT */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    padding: 24px 0;
  }

  /* CALENDAR */
  .calendar-section { grid-column: 1; }
  .sidebar { grid-column: 2; display: flex; flex-direction: column; gap: 16px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .month-label {
    font-size: 20px;
    font-weight: 800;
    min-width: 180px;
    text-align: center;
  }

  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .calendar-grid {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  .cal-day-name {
    padding: 10px;
    text-align: center;
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .cal-cells {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .cal-cell {
    min-height: 90px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell:hover { background: var(--surface2); }
  .cal-cell.empty { cursor: default; background: rgba(0,0,0,0.2); }
  .cal-cell.today .cell-date { 
    background: var(--accent); 
    color: var(--bg); 
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  .cell-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }

  .cell-pnl {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }
  .cell-pnl.profit { color: var(--profit); }
  .cell-pnl.loss { color: var(--loss); }

  .cell-trades {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
    font-family: 'Space Mono', monospace;
  }

  .cell-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 0 0 0 0;
  }
  .cell-bar.profit { background: var(--profit); opacity: 0.6; }
  .cell-bar.loss { background: var(--loss); opacity: 0.6; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .card-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .card-title .dot.red { background: var(--loss); }
  .card-title .dot.yellow { background: var(--accent3); }

  .card-total {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .card-total.green { color: var(--profit); }
  .card-total.red { color: var(--loss); }
  .card-total.yellow { color: var(--accent3); }

  /* FORM INPUTS */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  input[type="text"], input[type="number"], select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    flex: 1;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface2); }

  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-accent { background: var(--accent); color: var(--bg); }
  .btn-accent:hover { background: #00c98c; }
  .btn-red { background: var(--loss); color: #fff; }
  .btn-red:hover { background: #e03055; }
  .btn-yellow { background: var(--accent3); color: var(--bg); }
  .btn-yellow:hover { background: #e6c100; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ENTRY LIST */
  .entry-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .entry-list::-webkit-scrollbar { width: 4px; }
  .entry-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .entry-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
  }

  .entry-firm { color: var(--text); font-weight: 700; }
  .entry-amount.green { color: var(--profit); }
  .entry-amount.red { color: var(--loss); }
  .entry-date { color: var(--muted); font-size: 10px; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s;
    font-family: 'Space Mono', monospace;
  }
  .delete-btn:hover { color: var(--loss); background: rgba(255,77,109,0.1); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-width: 90vw;
    transform: translateY(20px);
    transition: transform 0.2s;
  }
  .modal-overlay.active .modal { transform: translateY(0); }

  .modal-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .modal-date {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 6px; font-family: 'Space Mono', monospace; }

  .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
  .modal-footer .btn { flex: 1; padding: 12px; }

  .trade-entries { margin-top: 16px; }
  .trade-entry-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
  }
  .te-symbol { color: var(--text); font-weight: 700; flex: 1; }
  .te-pnl.profit { color: var(--profit); }
  .te-pnl.loss { color: var(--loss); }

  /* STATS STRIP */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-box-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-family: 'Space Mono', monospace; margin-bottom: 6px; }
  .stat-box-value { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; }
  .stat-box-value.green { color: var(--profit); }
  .stat-box-value.red { color: var(--loss); }

  .note-text {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .sidebar { grid-column: 1; }
    .stats-strip { grid-template-columns: repeat(2, 1fr); }
    .header-stats { gap: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">Trade<span>Desk</span></div>
    <div class="header-stats">
      <div class="hstat">
        <div class="hstat-label">Month P&L</div>
        <div class="hstat-value green" id="header-pnl">$0.00</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Payouts</div>
        <div class="hstat-value yellow" id="header-payouts">$0.00</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Net</div>
        <div class="hstat-value green" id="header-net">$0.00</div>
      </div>
    </div>
  </header>

  <div class="stats-strip" style="margin-top:20px">
    <div class="stat-box">
      <div class="stat-box-label">Trading Days</div>
      <div class="stat-box-value" id="stat-days">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-box-label">Win Rate</div>
      <div class="stat-box-value green" id="stat-winrate">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-box-label">Best Day</div>
      <div class="stat-box-value green" id="stat-best">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-box-label">Worst Day</div>
      <div class="stat-box-value red" id="stat-worst">—</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- CALENDAR -->
    <div class="calendar-section">
      <div class="section-header">
        <span class="section-title">// Trading Calendar</span>
        <div class="month-nav">
          <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
          <div class="month-label" id="month-label"></div>
          <button class="nav-btn" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="calendar-grid">
        <div class="cal-days-header">
          <div class="cal-day-name">Sun</div>
          <div class="cal-day-name">Mon</div>
          <div class="cal-day-name">Tue</div>
          <div class="cal-day-name">Wed</div>
          <div class="cal-day-name">Thu</div>
          <div class="cal-day-name">Fri</div>
          <div class="cal-day-name">Sat</div>
        </div>
        <div class="cal-cells" id="cal-cells"></div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <!-- PAYOUTS CARD -->
      <div class="card">
        <div class="card-title"><div class="dot yellow"></div>Prop Firm Payouts</div>
        <div class="card-total yellow" id="payout-total">$0.00</div>
        <div class="input-row">
          <input type="text" id="payout-firm" placeholder="Firm name (e.g. FTMO)">
        </div>
        <div class="input-row">
          <input type="number" id="payout-amount" placeholder="Amount ($)" step="0.01">
          <input type="text" id="payout-date" placeholder="Date (MM/DD)" style="max-width:100px">
        </div>
        <button class="btn btn-yellow" onclick="addPayout()" style="width:100%">+ Add Payout</button>
        <div class="entry-list" id="payout-list" style="margin-top:12px"></div>
      </div>

      <!-- EXPENSES CARD -->
      <div class="card">
        <div class="card-title"><div class="dot red"></div>Prop Firm Expenses</div>
        <div class="card-total red" id="expense-total">$0.00</div>
        <div class="input-row">
          <input type="text" id="expense-firm" placeholder="Firm name">
        </div>
        <div class="input-row">
          <input type="text" id="expense-desc" placeholder="Description (e.g. Challenge fee)">
        </div>
        <div class="input-row">
          <input type="number" id="expense-amount" placeholder="Amount ($)" step="0.01">
          <input type="text" id="expense-date" placeholder="Date (MM/DD)" style="max-width:100px">
        </div>
        <button class="btn btn-red" onclick="addExpense()" style="width:100%">+ Add Expense</button>
        <div class="entry-list" id="expense-list" style="margin-top:12px"></div>
      </div>

      <!-- NET SUMMARY -->
      <div class="card">
        <div class="card-title"><div class="dot"></div>Monthly Summary</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:var(--muted);font-size:12px;font-family:'Space Mono',monospace">Trading P&L</span>
            <span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700" id="sum-pnl" class="green">$0.00</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:var(--muted);font-size:12px;font-family:'Space Mono',monospace">Payouts Received</span>
            <span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700" id="sum-payouts" class="yellow" style="color:var(--accent3)">$0.00</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:var(--muted);font-size:12px;font-family:'Space Mono',monospace">Firm Expenses</span>
            <span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700" id="sum-expenses" style="color:var(--loss)">$0.00</span>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:700;font-size:13px">NET</span>
            <span style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700" id="sum-net" class="green">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TRADE MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Log Trading Day</div>
    <div class="modal-date" id="modal-date-label"></div>

    <div class="form-group">
      <label class="form-label">Add Trade</label>
      <div class="input-row">
        <input type="text" id="trade-symbol" placeholder="Symbol (e.g. NQ, ES)">
        <input type="number" id="trade-pnl" placeholder="P&L ($)" step="0.01" style="max-width:120px">
        <button class="btn btn-ghost" onclick="addTradeToDay()" style="white-space:nowrap">+ Add</button>
      </div>
    </div>

    <div class="trade-entries" id="trade-entries"></div>

    <div class="form-group" style="margin-top:14px">
      <label class="form-label">Notes</label>
      <input type="text" id="trade-notes" placeholder="Market conditions, setup, etc.">
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveDay()">Save Day</button>
    </div>
  </div>
</div>

<script>
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  
  let now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  let currentEditDate = null;
  let tempTrades = [];

  // DATA STORE (localStorage)
  function getData() {
    return JSON.parse(localStorage.getItem('tradedesk_v2') || '{}');
  }
  function saveData(data) {
    localStorage.setItem('tradedesk_v2', JSON.stringify(data));
  }

  // ---- CALENDAR ----
  function renderCalendar() {
    const data = getData();
    const label = document.getElementById('month-label');
    label.textContent = `${MONTHS[viewMonth]} ${viewYear}`;

    const cells = document.getElementById('cal-cells');
    cells.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    // empty cells
    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-cell empty';
      cells.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData = data.days?.[key];
      const isToday = (d === now.getDate() && viewMonth === now.getMonth() && viewYear === now.getFullYear());

      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (isToday ? ' today' : '');
      cell.onclick = () => openModal(key, d);

      const dateEl = document.createElement('div');
      dateEl.className = 'cell-date';
      dateEl.textContent = d;
      cell.appendChild(dateEl);

      if (dayData) {
        const totalPnl = (dayData.trades || []).reduce((s, t) => s + t.pnl, 0);
        const pnlEl = document.createElement('div');
        pnlEl.className = 'cell-pnl ' + (totalPnl >= 0 ? 'profit' : 'loss');
        pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + '$' + Math.abs(totalPnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
        cell.appendChild(pnlEl);

        const tradesEl = document.createElement('div');
        tradesEl.className = 'cell-trades';
        tradesEl.textContent = `${dayData.trades?.length || 0} trade${(dayData.trades?.length||0)!==1?'s':''}`;
        cell.appendChild(tradesEl);

        const bar = document.createElement('div');
        bar.className = 'cell-bar ' + (totalPnl >= 0 ? 'profit' : 'loss');
        cell.appendChild(bar);

        if (dayData.notes) {
          const note = document.createElement('div');
          note.className = 'note-text';
          note.textContent = dayData.notes.substring(0, 20) + (dayData.notes.length > 20 ? '...' : '');
          cell.appendChild(note);
        }
      }

      cells.appendChild(cell);
    }

    updateStats();
  }

  function changeMonth(dir) {
    viewMonth += dir;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  }

  // ---- MODAL ----
  function openModal(key, day) {
    currentEditDate = key;
    tempTrades = [];

    const data = getData();
    const dayData = data.days?.[key];

    document.getElementById('modal-date-label').textContent = `// ${MONTHS[viewMonth]} ${day}, ${viewYear}`;
    document.getElementById('trade-symbol').value = '';
    document.getElementById('trade-pnl').value = '';
    document.getElementById('trade-notes').value = dayData?.notes || '';

    if (dayData?.trades) {
      tempTrades = [...dayData.trades];
    }

    renderTradeEntries();
    document.getElementById('modal').classList.add('active');
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById('modal')) {
      document.getElementById('modal').classList.remove('active');
      currentEditDate = null;
      tempTrades = [];
    }
  }

  function addTradeToDay() {
    const sym = document.getElementById('trade-symbol').value.trim().toUpperCase();
    const pnl = parseFloat(document.getElementById('trade-pnl').value);
    if (!sym || isNaN(pnl)) return;
    tempTrades.push({ id: Date.now(), symbol: sym, pnl });
    document.getElementById('trade-symbol').value = '';
    document.getElementById('trade-pnl').value = '';
    renderTradeEntries();
  }

  function renderTradeEntries() {
    const container = document.getElementById('trade-entries');
    container.innerHTML = '';
    if (!tempTrades.length) return;
    const total = tempTrades.reduce((s, t) => s + t.pnl, 0);
    tempTrades.forEach(t => {
      const row = document.createElement('div');
      row.className = 'trade-entry-row';
      row.innerHTML = `
        <span class="te-symbol">${t.symbol}</span>
        <span class="te-pnl ${t.pnl >= 0 ? 'profit' : 'loss'}">${t.pnl >= 0 ? '+' : ''}$${Math.abs(t.pnl).toFixed(2)}</span>
        <button class="delete-btn" onclick="removeTrade(${t.id})">×</button>
      `;
      container.appendChild(row);
    });
    const totRow = document.createElement('div');
    totRow.style.cssText = 'display:flex;justify-content:space-between;padding:8px 10px;font-family:Space Mono,monospace;font-size:12px;font-weight:700;margin-top:4px;border-top:1px solid var(--border)';
    totRow.innerHTML = `<span style="color:var(--muted)">TOTAL</span><span style="color:${total>=0?'var(--profit)':'var(--loss)'}">${total>=0?'+':''}$${Math.abs(total).toFixed(2)}</span>`;
    container.appendChild(totRow);
  }

  function removeTrade(id) {
    tempTrades = tempTrades.filter(t => t.id !== id);
    renderTradeEntries();
  }

  function saveDay() {
    if (!currentEditDate) return;
    const data = getData();
    if (!data.days) data.days = {};
    const notes = document.getElementById('trade-notes').value.trim();
    if (tempTrades.length > 0 || notes) {
      data.days[currentEditDate] = { trades: tempTrades, notes };
    } else {
      delete data.days[currentEditDate];
    }
    saveData(data);
    closeModal();
    renderCalendar();
  }

  // ---- PAYOUTS ----
  function addPayout() {
    const firm = document.getElementById('payout-firm').value.trim();
    const amount = parseFloat(document.getElementById('payout-amount').value);
    const date = document.getElementById('payout-date').value.trim();
    if (!firm || isNaN(amount) || amount <= 0) return;
    const data = getData();
    if (!data.payouts) data.payouts = [];
    data.payouts.push({ id: Date.now(), firm, amount, date: date || getTodayStr(), month: `${viewYear}-${viewMonth}` });
    saveData(data);
    document.getElementById('payout-firm').value = '';
    document.getElementById('payout-amount').value = '';
    document.getElementById('payout-date').value = '';
    renderPayouts();
    updateStats();
  }

  function renderPayouts() {
    const data = getData();
    const list = document.getElementById('payout-list');
    list.innerHTML = '';
    const filtered = (data.payouts || []).filter(p => p.month === `${viewYear}-${viewMonth}`);
    const total = filtered.reduce((s, p) => s + p.amount, 0);
    document.getElementById('payout-total').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('sum-payouts').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('header-payouts').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    filtered.forEach(p => {
      const el = document.createElement('div');
      el.className = 'entry-item';
      el.innerHTML = `
        <span class="entry-firm">${p.firm}</span>
        <span class="entry-date">${p.date}</span>
        <span class="entry-amount green">+$${p.amount.toFixed(2)}</span>
        <button class="delete-btn" onclick="deletePayout(${p.id})">×</button>
      `;
      list.appendChild(el);
    });
  }

  function deletePayout(id) {
    const data = getData();
    data.payouts = (data.payouts || []).filter(p => p.id !== id);
    saveData(data);
    renderPayouts();
    updateStats();
  }

  // ---- EXPENSES ----
  function addExpense() {
    const firm = document.getElementById('expense-firm').value.trim();
    const desc = document.getElementById('expense-desc').value.trim();
    const amount = parseFloat(document.getElementById('expense-amount').value);
    const date = document.getElementById('expense-date').value.trim();
    if (!firm || isNaN(amount) || amount <= 0) return;
    const data = getData();
    if (!data.expenses) data.expenses = [];
    data.expenses.push({ id: Date.now(), firm, desc, amount, date: date || getTodayStr(), month: `${viewYear}-${viewMonth}` });
    saveData(data);
    document.getElementById('expense-firm').value = '';
    document.getElementById('expense-desc').value = '';
    document.getElementById('expense-amount').value = '';
    document.getElementById('expense-date').value = '';
    renderExpenses();
    updateStats();
  }

  function renderExpenses() {
    const data = getData();
    const list = document.getElementById('expense-list');
    list.innerHTML = '';
    const filtered = (data.expenses || []).filter(e => e.month === `${viewYear}-${viewMonth}`);
    const total = filtered.reduce((s, e) => s + e.amount, 0);
    document.getElementById('expense-total').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById('sum-expenses').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    filtered.forEach(e => {
      const el = document.createElement('div');
      el.className = 'entry-item';
      el.innerHTML = `
        <div><span class="entry-firm">${e.firm}</span> <span style="color:var(--muted);font-size:10px">${e.desc}</span></div>
        <span class="entry-date">${e.date}</span>
        <span class="entry-amount red">-$${e.amount.toFixed(2)}</span>
        <button class="delete-btn" onclick="deleteExpense(${e.id})">×</button>
      `;
      list.appendChild(el);
    });
  }

  function deleteExpense(id) {
    const data = getData();
    data.expenses = (data.expenses || []).filter(e => e.id !== id);
    saveData(data);
    renderExpenses();
    updateStats();
  }

  // ---- STATS ----
  function updateStats() {
    const data = getData();
    const days = data.days || {};
    // filter to current month
    const prefix = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-`;
    const monthKeys = Object.keys(days).filter(k => k.startsWith(prefix));

    let totalPnl = 0, wins = 0, losses = 0, best = null, worst = null;
    monthKeys.forEach(k => {
      const pnl = (days[k].trades || []).reduce((s, t) => s + t.pnl, 0);
      totalPnl += pnl;
      if (pnl > 0) wins++; else losses++;
      if (best === null || pnl > best) best = pnl;
      if (worst === null || pnl < worst) worst = pnl;
    });

    const tradingDays = monthKeys.length;
    const winRate = tradingDays > 0 ? Math.round((wins / tradingDays) * 100) : null;

    document.getElementById('stat-days').textContent = tradingDays;
    document.getElementById('stat-winrate').textContent = winRate !== null ? winRate + '%' : '—';
    document.getElementById('stat-best').textContent = best !== null ? '+$' + best.toFixed(2) : '—';
    document.getElementById('stat-worst').textContent = worst !== null ? '-$' + Math.abs(worst).toFixed(2) : '—';

    const pnlEl = document.getElementById('header-pnl');
    pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + '$' + Math.abs(totalPnl).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    pnlEl.className = 'hstat-value ' + (totalPnl >= 0 ? 'green' : 'red');

    document.getElementById('sum-pnl').textContent = (totalPnl >= 0 ? '+' : '') + '$' + Math.abs(totalPnl).toFixed(2);
    document.getElementById('sum-pnl').className = totalPnl >= 0 ? 'green' : 'red';

    // net
    const payouts = (data.payouts || []).filter(p => p.month === `${viewYear}-${viewMonth}`).reduce((s, p) => s + p.amount, 0);
    const expenses = (data.expenses || []).filter(e => e.month === `${viewYear}-${viewMonth}`).reduce((s, e) => s + e.amount, 0);
    const net = totalPnl + payouts - expenses;
    const netEl = document.getElementById('header-net');
    netEl.textContent = (net >= 0 ? '+' : '') + '$' + Math.abs(net).toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2});
    netEl.className = 'hstat-value ' + (net >= 0 ? 'green' : 'red');

    const sumNetEl = document.getElementById('sum-net');
    sumNetEl.textContent = (net >= 0 ? '+' : '') + '$' + Math.abs(net).toFixed(2);
    sumNetEl.style.color = net >= 0 ? 'var(--profit)' : 'var(--loss)';
  }

  function getTodayStr() {
    const d = new Date();
    return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.getElementById('modal').classList.contains('active')) addTradeToDay();
  });

  // INIT
  renderCalendar();
  renderPayouts();
  renderExpenses();
</script>
</body>
</html>
